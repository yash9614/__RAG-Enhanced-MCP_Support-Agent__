[project]
name = "rag-mcp-support"
version = "0.1.0"
description = "RAG-enhanced MCP support agent with FastAPI + ChromaDB"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "mcp>=1.0.0",
    "langchain-openai>=0.2.0",
    "langchain-chroma>=0.1.4",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.9.0",
    "sqlalchemy>=2.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
